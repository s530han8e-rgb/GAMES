name: Publish approved East Still Open demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: approved-pages-release
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: east-still-open
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Verify this exact approved revision
        run: npm run check:ci
      - name: Build for the permanent project URL
        run: npm run build -- --base=/GAMES/east-still-open/
      - name: Assemble only public runtime files
        run: node scripts/prepare-site.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site-public
          retention-days: 1
  deploy:
    needs: verify-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}east-still-open/
    steps:
      - name: Deploy only after the approved revision passes
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
