name: East Still Open - game checks

on:
  push:
    paths:
      - 'east-still-open/**'
      - '.github/workflows/east-still-open-tests.yml'
  pull_request:
    paths:
      - 'east-still-open/**'
      - '.github/workflows/east-still-open-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-checks:
    name: Story, UI, animation and save checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: east-still-open
    env:
      CI: 'true'
    steps:
      - name: Check out the exact submitted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps chrome
      - name: Check story, interfaces and recovery
        id: checks
        run: npm run check:ci
      - name: Write result and error report
        if: always()
        env:
          GAME_CHECK_STEP_OUTCOME: ${{ steps.checks.outcome }}
        run: npm run check:ci-report
      - name: Attach bounded reports and representative screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: east-still-open-checks-${{ github.run_number }}-${{ github.run_attempt }}
          path: east-still-open/checks/ci-report/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
